# Isolated configuration branch; build source is pinned separately in ci/.
version: re-test.{build}
image: Visual Studio 2022
max_jobs: 1
platform: x64
configuration: Release
branches:
  only:
    - ci/public-client-302eb-staged-20261103
skip_tags: true
skip_branch_with_pr: true
clone_depth: 1
shallow_clone: false
build: off
test: off
deploy: off
cache:
