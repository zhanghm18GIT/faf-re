# Optional default-branch registration only, at .github/workflows/render-source-check.yml.
# No engine checkout or work can run from this inert default-branch copy.
name: Rendering source checks (bounded Windows)
'on':
  workflow_dispatch:
    inputs:
      driver_sha:
        description: Exact independently reviewed CI-driver commit
        required: true
        type: string
      sdk_public_build_approved:
        description: Newly approved bounded public temporary SDK builds
        required: true
        default: false
        type: boolean
      authorization_reference:
        description: Public-safe scoped approval label for this bounded run
        required: true
        type: string
permissions: {}
jobs:
  registration-only:
    if: ${{ false }}
    runs-on: windows-2022
    timeout-minutes: 1
    steps:
      - run: echo "Inert registration only. Dispatch the independently reviewed driver branch."
