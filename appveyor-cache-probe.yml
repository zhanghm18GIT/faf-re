# One read-only native-cache probe. Executor verifies the published commit before launch.
version: cache-probe.{build}
image: Visual Studio 2022
max_jobs: 1
build_timeout: 10
platform: x64
configuration: Release
branches:
  only:
    - ci/public-client-302eb-staged-20261103
skip_tags: true
skip_branch_with_pr: true
clone_depth: 1
shallow_clone: false
build: off
test: off
deploy: off
cache:
  - 'C:\faf-re-resume\1d5b8e891336b77e0422f035\checkpoint.zip -> ci/resume-recipe.json'
artifacts: []
notifications: []
services: []
assembly_info:
  patch: false
dotnet_csproj:
  patch: false
environment:
  APPVEYOR_SKIP_FINALIZE_ON_EXIT: 'true'
  APPVEYOR_CACHE_SKIP_SAVE: 'true'
  APPVEYOR_CACHE_SKIP_RESTORE: 'false'
  APPVEYOR_SAVE_CACHE_ON_ERROR: 'false'
  APPVEYOR_CACHE_ENTRY_UPLOAD_DOWNLOAD_TIMEOUT: '300'
  APPVEYOR_ARTIFACT_UPLOAD_TIMEOUT: '300'
  CMAKE_BUILD_PARALLEL_LEVEL: '2'
  GIT_TERMINAL_PROMPT: '0'
  GIT_LFS_SKIP_SMUDGE: '1'
init:
  - ps: |
      $ErrorActionPreference = 'Stop'
      if ($env:APPVEYOR_PROJECT_SLUG -ne 'faf-re' -or $env:APPVEYOR_REPO_NAME -ne 'zhanghm18GIT/faf-re' -or $env:APPVEYOR_REPO_BRANCH -ne 'ci/public-client-302eb-staged-20261103') { throw 'Unexpected smoke/probe project or source identity' }
      if ($env:APPVEYOR_PULL_REQUEST_NUMBER) { throw 'No pull request probe' }
install:
  - ps: |
      $ErrorActionPreference = 'Stop'
      if ($env:APPVEYOR_PROJECT_SLUG -ne 'faf-re' -or $env:APPVEYOR_REPO_NAME -ne 'zhanghm18GIT/faf-re' -or $env:APPVEYOR_REPO_BRANCH -ne 'ci/public-client-302eb-staged-20261103') { throw 'Unexpected smoke/probe project or source identity' }
      if ($env:APPVEYOR_PULL_REQUEST_NUMBER) { throw 'No pull request probe' }
      # Read-only checkpoint presence/integrity probe. No extraction or cache writes.
      $ErrorActionPreference = 'Stop'
      $file = 'C:\faf-re-resume\1d5b8e891336b77e0422f035\checkpoint.zip'
      if ($env:APPVEYOR_CACHE_SKIP_SAVE -ne 'true') { throw 'Probe save must stay disabled' }
      if (Test-Path -LiteralPath $file) {
          $item = Get-Item -LiteralPath $file -Force
          if ($item.PSIsContainer -or ($item.Attributes -band [IO.FileAttributes]::ReparsePoint)) { throw 'Unexpected checkpoint type' }
          $size = $item.Length
          $sha = (Get-FileHash -Algorithm SHA256 -LiteralPath $file).Hash.ToLowerInvariant()
          $matches = ($size -eq 87842777 -and $sha -eq '4cbc39071e05cb2250cfd17749524f9ddfb4d099ffec8a679c8d71573a18024d')
          Write-Host ('CHECKPOINT_PROBE ' + (@{ present=$true; size=$size; sha256=$sha; matches_expected_A55023587=$matches } | ConvertTo-Json -Compress))
      } else {
          Write-Host 'CHECKPOINT_PROBE {"present":false,"matches_expected_A55023587":false}'
      }
      # No false assignment to cache-save or finalize: read-only even on a cache hit.
      Exit-AppveyorBuild
before_build: []
after_build: []
before_test: []
after_test: []
before_deploy: []
after_deploy: []
on_success: []
on_failure: []
on_finish: []
